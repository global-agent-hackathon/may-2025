[project]
name = "mcd-python-template"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<3.13"
dependencies = [
  "agno[pdf]>=1.3.4",
  "anthropic>=0.49.0",
  "azure-cognitiveservices-speech>=1.43.0",
  "blinker>=1.9.0",
  "cachetools>=5.5.0",
  "cohere>=5.15.0",
  "dotenv>=0.9.9",
  "exa-py>=1.13.1",
  "google-cloud-aiplatform>=1.90.0",
  "google-genai>=1.11.0",
  "google-generativeai>=0.8.5",
  "lancedb>=0.21.2",
  "mip>=1.15.0",
  "openai>=1.75.0",
  "pdf2image>=1.17.0",
  "protobuf>=5.29.0",
  "pyaudio>=0.2.14",
  "pylance>=0.25.2",
  "pypandoc>=1.15",
  "pypdf>=5.4.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "pytest-mock>=3.14.0",
  "python-pptx>=1.0.2",
  "sqlalchemy>=2.0.40",
  "streamlit>=1.44.1",
  "tachyon-platform>=0.1.2",
  "tantivy>=0.22.2",
  "toml>=0.10.2",
  "tornado>=6.4.2",
]

[project.optional-dependencies]
dbt = [
  "dbt-bigquery>=1.8.3"
]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pre-commit>=4.0.1",
  "shandy-sqlfmt[jinjafmt]>=0.24.0",
  "ruff>=0.8.1",
  "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
  # list of rules are available at https://beta.ruff.rs/docs/rules/
  "E", # pycodestyle (error)
  "W", # pycodestyle (warning)
  "F", # Pyflakes
  "B", # flake8-bugbear
  "I", # isort
]

[tool.mypy]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
# 型スタブが存在しないサードパーティモジュールの無視設定
[[tool.mypy.overrides]]
module = [
    "pptx.*",
    "pdf2image.*",
    "pypdf.*"
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.sqlfmt]
exclude = [
  "dbt/target/**/*",
  "dbt/dbt_packages/**/*",
  ".venv/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
