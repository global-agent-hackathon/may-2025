<!DOCTYPE html>
<html>
<head>
    <title>VibeProto</title>
    <!-- Corrected path for styles.css -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar: Saved Sessions -->
        <div class="sidebar left-sidebar">
            <h2>Saved Sessions</h2>
            <div id="session-list" class="session-list">
                <!-- Sessions will be dynamically added here -->
            </div>
            <button id="new-session">New Session</button>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <h1>VibeProto</h1>
            <p>Build prototypes with natural language</p>
            <h2>What do you want to build?</h2>
            <div id="chat-messages" class="chat-messages">
                <!-- Messages will be dynamically added here -->
            </div>
            <div class="chat-input">
                <textarea id="prompt" rows="3" placeholder="Describe your prototype in plain English..."></textarea>
                <div class="prompt-actions">
                    <select id="prototype-type">
                        <option value="automation_script">Automation Script</option>
                        <option value="web_app">Web App</option>
                    </select>
                    <button id="enhance-prompt" class="btn-secondary">Enhance Prompt ✨</button>
                </div>
                <button id="generate">Generate Prototype</button>
            </div>
            <p id="status">Enter a prompt to start...</p>
        </div>

        <!-- Right Sidebar: Code Display -->
        <div class="sidebar right-sidebar">
            <h2>Generated Code</h2>
            <div id="code-output" class="code-display">
                <pre>Generated code will appear here...</pre>
            </div>
            <div class="code-actions">
                <button id="copy-code">Copy Code</button>
                <button id="download-code">Download</button>
                <button id="analyze-code">Analyze</button>
            </div>
        </div>
    </div>
    <!-- Corrected path for script.js -->
    <script src="script.js"></script>
</body>
</html>
